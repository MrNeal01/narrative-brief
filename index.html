<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Brief Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: studio workbench — step rail on the left, one section at a time on a work surface, PDF "paper" at the end */
:root{
  --bg:#ECF0F2; --surface:#FFFFFF; --sunk:#E2E8EB; --ink:#14212A; --muted:#55656F; --line:#CBD4D9;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D3ECEA;
  --ex-bg:#FFF3D6; --ex-ink:#5E420C; --ex-line:#E8C67A;
  --ok:#1E7A3C; --warn:#A15C00; --danger:#B42318;
  --paper:#FFFFFF; --paper-ink:#1A1F24; --paper-muted:#6B7480; --paper-line:#D7DDE2; --paper-accent:#0B7A75; --paper-soft:#EEF5F4;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151A; --surface:#162128; --sunk:#1D2A32; --ink:#E4EBEE; --muted:#92A2AC; --line:#2B3943;
  --accent:#43C3B9; --accent-ink:#04201E; --accent-soft:#163A38;
  --ex-bg:#2A2314; --ex-ink:#F0D69E; --ex-line:#5E4A22;
  --ok:#6FD08F; --warn:#F2B35C; --danger:#F2877C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#162128; --sunk:#1D2A32; --ink:#E4EBEE; --muted:#92A2AC; --line:#2B3943;
  --accent:#43C3B9; --accent-ink:#04201E; --accent-soft:#163A38;
  --ex-bg:#2A2314; --ex-ink:#F0D69E; --ex-line:#5E4A22;
  --ok:#6FD08F; --warn:#F2B35C; --danger:#F2877C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800}
.brand span{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chipbtn[aria-pressed="true"]{border-color:var(--ex-line);background:var(--ex-bg);color:var(--ex-ink)}
.grouptag{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--accent-soft)}
.grouptag b{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:12px;color:var(--muted);min-width:9ch}
.status.warn{color:var(--warn)}

/* shell */
.shell{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);display:flex;flex-direction:column;gap:2px}
.rail button{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.rail button:hover{background:var(--sunk)}
.rail button[aria-current="step"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.rail .nm{font-weight:500;font-size:14px;line-height:1.25}
.rail .no{font-family:var(--f-mono);font-size:11px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.done{border-color:var(--accent);background:var(--accent)}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:4px 10px 12px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.sec-head{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:center}
.sec-ic{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.sec-ic svg{width:34px;height:34px}
.sec-head h1{font-size:clamp(26px,4vw,36px);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:15px}
.hint{color:var(--muted);font-size:14px;margin:-4px 0 0}
.ex{border:1px dashed var(--ex-line);background:var(--ex-bg);color:var(--ex-ink);border-radius:8px;padding:10px 12px;font-size:14px}
.ex .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;display:block;margin-bottom:4px;opacity:.85}
.ex table{border-collapse:collapse;width:100%;font-size:13px}
.ex td,.ex th{border-top:1px solid var(--ex-line);padding:4px 6px;text-align:left;vertical-align:top}
.ex th{font-weight:700}
.ex ul,.ex ol{margin:0;padding-left:20px}
.exwrap{overflow-x:auto}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-width:0}
textarea{min-height:84px;resize:vertical}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--surface)}
.row .idx{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:22px}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.cell span{font-size:12px;color:var(--muted);font-weight:500}
.rowfoot{grid-column:2;display:flex;justify-content:flex-end}
.fixedlbl{font-weight:700;font-size:14px}
.fixedlbl small{display:block;font-weight:400;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;font-size:13px}
.btn.ghost:hover{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;background:var(--bg)}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.imgs figure{margin:0;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;max-width:100%;background:var(--sunk)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.imgs figure button{position:absolute;top:6px;right:6px;border:0;border-radius:6px;background:var(--surface);color:var(--ink);padding:2px 8px;cursor:pointer;font-size:12px}
.drop{border:2px dashed var(--line);border-radius:8px;aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;font-size:14px;padding:8px;background:var(--bg)}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.visual{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;overflow-x:auto}
.visual svg{display:block;width:100%;height:auto;min-width:520px}
.visual figcaption{color:var(--muted);font-size:13px;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* review */
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.prog button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);cursor:pointer}
.prog button:hover{border-color:var(--accent)}
.prog .bar{grid-column:1/-1;height:5px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.prog .pc{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.exportbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn)}
.paperwrap{overflow-x:auto;background:var(--sunk);border-radius:var(--r);padding:16px}

/* paper (PDF) — fixed print colours, hex only for the PDF renderer */
#paper{width:700px;margin:0 auto;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:12.5px;line-height:1.45;padding:28px 30px}
#paper h1{font-size:26px;font-weight:800;color:var(--paper-ink)}
#paper h2{font-size:16px;font-weight:800;color:var(--paper-accent);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--paper-accent)}
#paper h3{font-size:12.5px;font-family:var(--f-body);font-weight:700;margin:10px 0 3px;color:var(--paper-ink)}
#paper p{margin:0}
#paper .pmeta{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:10px;padding:10px 12px;background:var(--paper-soft);border-radius:6px}
#paper .pmeta span{color:var(--paper-muted)}
#paper .kick{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted)}
#paper .empty{color:var(--paper-muted);font-style:italic}
#paper table{width:100%;border-collapse:collapse;margin-top:2px;font-size:11.5px}
#paper th{background:var(--paper-soft);text-align:left;font-weight:700;padding:5px 6px;border:1px solid var(--paper-line)}
#paper td{padding:5px 6px;border:1px solid var(--paper-line);vertical-align:top}
#paper ul{margin:2px 0 0;padding-left:18px}
#paper .pimgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
#paper .pimgs img{width:100%;border:1px solid var(--paper-line);border-radius:4px;display:block}
#paper .pfoot{margin-top:22px;padding-top:8px;border-top:1px solid var(--paper-line);color:var(--paper-muted);font-size:10.5px;display:flex;justify-content:space-between}
#paper svg text{font-family:var(--f-body)}

/* gate */
.gate{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.gate-card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:16px}
.gate-card h1{font-size:30px;font-weight:800}
.gate-card p{margin:0;color:var(--muted)}
.gate-art{color:var(--accent)}
.gate-art svg{width:100%;height:auto;display:block}
.gate-row{display:flex;gap:10px;flex-wrap:wrap}
.gate-row input{flex:1 1 200px}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--danger);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .rail button{grid-template-columns:auto auto;flex:none}
  .rail .nm{display:none}
  .rail button[aria-current="step"] .nm{display:block}
  .rail .dot{display:none}
  .meter{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="gate" class="gate"></div>
<div id="app" hidden>
  <header class="top"><div class="top-in" id="topbar"></div></header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<input type="file" id="jsonIn" accept=".json,application/json" class="sr" tabindex="-1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>

const L=(en,tr)=>({en,tr});

};
let lang=store.get("nb-lang")==="tr"?"tr":"en";
let showEx=store.get("nb-ex")!=="0";
const t=o=>o==null?"":(typeof o==="string"?o:(o[lang]??o.en));

/* ---------- interface text ---------- */
const U={

  dlNone:L("Downloads are not available in this view. Open the form file your instructor shared instead.","Bu görünümde indirme kullanılamıyor. Bunun yerine hocanızın paylaştığı form dosyasını açın."),
  saveJson:L("Save progress file","İlerleme dosyasını kaydet"),
  loadJson:L("Open progress file","İlerleme dosyası aç"),
  jsonNote:L("A progress file lets you continue on another computer or share the draft with your team.","İlerleme dosyası, başka bir bilgisayarda devam etmenizi veya taslağı ekibinizle paylaşmanızı sağlar."),
  loaded:L("Progress file opened","İlerleme dosyası açıldı"),
  badJson:L("That file is not a progress file from this form.","Bu dosya, bu formun ilerleme dosyası değil."),
  bb:L("Submit: upload this PDF to the Week 4 assignment on Blackboard. One upload per group; the file name already includes your group name.","Teslim: Bu PDF'i Blackboard'daki 4. Hafta ödevine yükleyin. Her grup bir kez yükler; dosya adında grup adınız zaten yer alıyor."),
  preview:L("PDF preview","PDF önizleme"),
  members:L("Team","Ekip"),
  gameTitle:L("Game","Oyun"),
  date:L("Date","Tarih"),
  group:L("Group","Grup"),
  storageWarn:L("This browser is not keeping your answers. Save a progress file before you close the page.","Bu tarayıcı cevaplarınızı saklamıyor. Sayfayı kapatmadan önce ilerleme dosyasını kaydedin."),
  intensity:L("Intensity","Yoğunluk"),
  curve:L("Intensity curve — fill the Intensity column to draw it","Yoğunluk eğrisi — çizmek için Yoğunluk sütununu doldurun")
};

const IC={

  delivery:'<path d="M4 5h16v11H9l-5 4Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',

let state=null, groupKey="", step=0, saveTimer=null, storageOk=true;
const norm=s=>s.trim().toLocaleLowerCase("tr").replace(/\s+/g," ");
const keyFor=g=>"nb-draft:"+norm(g);
function defaults(f){
  switch(f.type){
    case "table": return Array.from({length:f.min||1},()=>f.cols.map(()=>""));
    case "matrix": return f.rows.map(()=>f.cols.map(()=>""));
    case "list": return Array.from({length:f.min||1},()=>"");
    case "chips": case "images": return [];
    case "checks": return {sel:[],other:""};
    default: return "";
  }
}
function fresh(group){
  const d={v:1,data:{}};
  SECTIONS.forEach(s=>s.fields.forEach(f=>d.data[f.id]=defaults(f)));
  d.data.group=group; return d;
}
function sanitize(d){
  const out=fresh(d?.data?.group||"");
  if(!d||typeof d!=="object"||!d.data) return out;
  SECTIONS.forEach(s=>s.fields.forEach(f=>{
    const v=d.data[f.id], def=out.data[f.id];
    if(v==null) return;
    if(typeof def==="string") out.data[f.id]=typeof v==="string"?v:"";
    else if(f.type==="checks") out.data[f.id]={sel:Array.isArray(v.sel)?v.sel.filter(x=>typeof x==="string"):[],other:typeof v.other==="string"?v.other:""};
    else if(f.type==="table"||f.type==="matrix"){
      if(!Array.isArray(v)) return;
      let rows=v.filter(Array.isArray).map(r=>f.cols.map((_,i)=>typeof r[i]==="string"?r[i]:""));
      if(f.type==="matrix"){ rows=f.rows.map((_,i)=>rows[i]||f.cols.map(()=>"")); }
      else if(!rows.length) rows=def;
      out.data[f.id]=rows;
    }
    else if(Array.isArray(v)) out.data[f.id]=v.filter(x=>typeof x==="string").slice(0,f.max||50);
  }));
  return out;
}
function groups(){try{return JSON.parse(store.get("nb-groups")||"[]").filter(x=>typeof x==="string")}catch(e){return []}}
function rememberGroup(g){const list=groups().filter(x=>norm(x)!==norm(g));list.unshift(g);store.set("nb-groups",JSON.stringify(list.slice(0,8)))}
function openGroup(g){
  groupKey=keyFor(g);
  let d=null; try{d=JSON.parse(store.get(groupKey)||"null")}catch(e){d=null}
  state=d?sanitize(d):fresh(g);
  state.data.group=g.trim();
  rememberGroup(g.trim());
  const st=parseInt(store.get(groupKey+":step")||"0",10);
  step=Number.isFinite(st)&&st>=0&&st<=REVIEW_STEP?st:0;
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  saveNow(); renderAll();
}
function saveNow(){

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false) continue;
    if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k==="value") el.value=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))) }
  return el;
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el=h("div",{class:"toast",role:"status"},msg); document.body.append(el);
  setTimeout(()=>el.remove(),3800);
}
const filledStr=s=>typeof s==="string"&&s.trim()!=="";
function isFilled(f,v){
  switch(f.type){
    case "table": case "matrix": return v.some(r=>r.some(filledStr));
    case "list": return v.some(filledStr);
    case "chips": case "images": return v.length>0;
    case "checks": return v.sel.length>0||filledStr(v.other);
    default: return filledStr(v);
  }
}
function secProgress(i){const s=SECTIONS[i];const n=s.fields.filter(f=>isFilled(f,state.data[f.id])).length;return n/s.fields.length}

function fieldEl(f){
  const d=state.data; const id=fid(f.id);

function renderTopGroup(){const b=document.querySelector(".grouptag b");if(b){b.textContent=state.data.group;b.title=state.data.group}}
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
      const max=1100,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      const x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.74));};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

function curveSVG(rows,ink,muted,accent,line,labels){
  const W=640,H=200,l=40,r=20,top=18,bot=40,iw=W-l-r,ih=H-top-bot;
  const xs=i=>l+iw*(i/5), ys=v=>top+ih*(1-(v-1)/4);
  let g="";
  for(let v=1;v<=5;v++) g+=`<line x1="${l}" x2="${W-r}" y1="${ys(v)}" y2="${ys(v)}" stroke="${line}" stroke-width="1"/><text x="${l-12}" y="${ys(v)+4}" font-size="11" text-anchor="end" fill="${muted}">${v}</text>`;
  for(let i=0;i<6;i++) g+=`<text x="${xs(i)}" y="${H-18}" font-size="12" text-anchor="middle" fill="${muted}">${labels?labels[i]:i+1}</text>`;
  const pts=rows.map((r,i)=>{const v=parseInt(r,10);return v>=1&&v<=5?[xs(i),ys(v)]:null});
  const valid=pts.filter(Boolean);
  let path="";
  if(valid.length>1){
    path=`<path d="M${valid[0][0]} ${top+ih} ${valid.map(p=>"L"+p[0]+" "+p[1]).join(" ")} L${valid[valid.length-1][0]} ${top+ih}Z" fill="${accent}" fill-opacity="0.12"/>`+
         `<polyline points="${valid.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${accent}" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  const dots=valid.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${accent}"/>`).join("");
  const emptyMsg=valid.length?"":`<text x="${W/2}" y="${top+ih/2}" font-size="13" text-anchor="middle" fill="${muted}">${t(U.curve)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t(U.intensity)}">${g}${path}${dots}${emptyMsg}<text x="${l}" y="${H-2}" font-size="11" fill="${muted}" font-family="monospace">${t(U.intensity).toUpperCase()} · BEAT 1→6</text></svg>`;
}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function drawCurve(){
  const el=document.getElementById("curve"); if(!el) return;
  const rows=state.data.beatrows.map(r=>r[4]);
  el.innerHTML=curveSVG(rows,css("--ink"),css("--muted"),css("--accent"),css("--line"));
}

/* ---------- main ---------- */
function renderMain(){
  const m=document.getElementById("main"); m.innerHTML="";
  if(step===REVIEW_STEP){renderReview(m);return}
  const s=SECTIONS[step];
  m.append(h("div",{class:"sec-head"},h("div",{class:"sec-ic",html:svgIcon(s.icon)}),
    h("div",null,h("div",{class:"mono",style:"color:var(--muted)"},(lang==="tr"?"Bölüm ":"Section ")+step+" / "+(SECTIONS.length-1)),h("h1",null,t(s.title)),h("p",null,t(s.intro)))));
  if(s.visual==="bridge"){
    const fig=h("figure",{class:"visual",style:"margin:0"});
    fig.innerHTML=bridgeSVG(css("--ink"),css("--muted"),css("--accent"),css("--accent-soft"),css("--surface"));
    fig.append(h("figcaption",null,lang==="tr"?"Önceki bölümlerde yazdığınız her şey bu üç kutudan birine düşmeli.":"Everything you wrote in the earlier sections should land in one of these three boxes."));
    m.append(fig);
  }
  if(s.visual==="curve"){
    const fig=h("figure",{class:"visual",style:"margin:0"},h("div",{id:"curve"}),
      h("figcaption",null,lang==="tr"?"İyi bir platform oyunu genellikle yükselir, kısa nefes aldırır ve doruğa çıkar. Düz bir çizgi, tekdüze bir deneyim demektir.":"A good platformer usually rises, gives a short breather, then peaks. A flat line means a flat experience."));
    m.append(fig);
  }
  const card=h("div",{class:"card"});
  let halfBuf=[];
  const flush=()=>{if(halfBuf.length){card.append(h("div",{class:"grid2"},halfBuf));halfBuf=[]}};
  s.fields.forEach(f=>{const el=fieldEl(f); if(f.half) halfBuf.push(el); else {flush();card.append(el)}});
  flush();
  m.append(card);
  if(s.visual==="curve") drawCurve();
  m.append(h("div",{class:"nav"},
    step>0?h("button",{class:"btn",type:"button",onclick:()=>go(step-1)},"← "+t(U.back)):h("span"),
    h("button",{class:"btn primary",type:"button",onclick:()=>go(step+1)},(step===SECTIONS.length-1?t(U.review):t(U.next))+" →")));
}

/* ---------- review & PDF ---------- */
function renderReview(m){
  m.append(h("div",{class:"sec-head"},h("div",{class:"sec-ic",html:svgIcon("review")}),h("div",null,h("h1",null,t(U.review)),h("p",null,t(U.reviewIntro)))));
  if(!storageOk) m.append(h("p",{class:"note warn"},t(U.storageWarn)));
  const prog=h("div",{class:"prog"});
  SECTIONS.forEach((s,i)=>{const p=Math.round(secProgress(i)*100);
    prog.append(h("button",{type:"button",onclick:()=>go(i)},h("span",null,t(s.title)),h("span",{class:"pc"},p+"%"),h("span",{class:"bar"},h("i",{style:"width:"+p+"%"}))))});
  m.append(prog);
  const dlBtn=h("button",{class:"btn primary",type:"button",id:"dlbtn",onclick:downloadPdf},t(U.download));
  m.append(h("div",{class:"card",style:"gap:14px"},
    h("div",{class:"exportbar"},dlBtn,
      h("button",{class:"btn",type:"button",onclick:saveJson},t(U.saveJson)),
      h("button",{class:"btn",type:"button",onclick:()=>document.getElementById("jsonIn").click()},t(U.loadJson))),
    h("p",{class:"hint",style:"margin:0"},t(U.jsonNote)),
    h("p",{class:"note",style:"margin:0"},t(U.bb))));
  m.append(h("div",{class:"mono",style:"color:var(--muted)"},t(U.preview)));
  m.append(h("div",{class:"paperwrap"},buildPaper()));
}
function pval(f,v){
  const E=()=>h("p",{class:"empty"},t(U.empty));
  if(!isFilled(f,v)) return E();
  switch(f.type){
    case "select": return h("p",null,optLabel(f.opts,v));
    case "chips": return h("p",null,v.map(x=>optLabel(f.opts,x)).join(", "));
    case "checks": {const items=v.sel.map(x=>optLabel(f.opts,x)).filter(Boolean);if(filledStr(v.other))items.push(t(U.other)+": "+v.other);
      return f.id==="checklist"?h("ul",null,f.opts.map(o=>h("li",null,(v.sel.includes(o.v)?"☑ ":"☐ ")+t(o.l)))):h("p",null,items.join(" · "));}
    case "list": return h("ul",null,v.filter(filledStr).map(x=>h("li",null,x)));
    case "images": return h("div",{class:"pimgs"},v.map(src=>h("img",{src,alt:""})));
    case "table": {const rows=v.filter(r=>r.some(filledStr));
      return h("table",null,h("tr",null,f.cols.map(c=>h("th",null,t(c.l)))),rows.map(r=>h("tr",null,r.map((c,i)=>h("td",null,f.cols[i].opts?optLabel(f.cols[i].opts,c):c)))));}
    case "matrix": {
      const rows=v.map((r,i)=>[i,r]).filter(([,r])=>r.some(filledStr));
      return h("table",null,h("tr",null,h("th",null,""),f.cols.map(c=>h("th",null,t(c.l)))),rows.map(([i,r])=>h("tr",null,h("td",null,h("b",null,t(f.rows[i].l))),r.map((c,ci)=>h("td",null,f.cols[ci].opts?optLabel(f.cols[ci].opts,c):c)))));}
    default: return h("p",{style:"white-space:pre-wrap"},v);
  }
}
function buildPaper(){
  const d=state.data;
  const today=new Date().toLocaleDateString(lang==="tr"?"tr-TR":"en-GB");
  const p=h("div",{id:"paper"});
  p.append(h("div",{class:"kick"},t(U.course)),h("h1",null,t(U.app)),
    h("div",{class:"pmeta"},
      h("div",null,h("span",null,t(U.group)+": "),h("b",null,d.group||"—")),
      h("div",null,h("span",null,t(U.gameTitle)+": "),h("b",null,d.title||"—")),
      h("div",null,h("span",null,t(U.members)+": "),[d.designer&&(lang==="tr"?"Tasarım: ":"Design: ")+d.designer,d.developer&&(lang==="tr"?"Geliştirme: ":"Dev: ")+d.developer,d.artist&&(lang==="tr"?"Sanat: ":"Art: ")+d.artist].filter(Boolean).join(" · ")||"—"),
      h("div",null,h("span",null,t(U.date)+": "),today)));
  SECTIONS.slice(1).forEach((s,i)=>{
    p.append(h("h2",null,(i+1)+". "+t(s.title)));
    if(s.visual==="curve"){
      const c=h("div",{style:"margin:4px 0 6px"}); c.innerHTML=curveSVG(d.beatrows.map(r=>r[4]),"#1A1F24","#6B7480","#0B7A75","#D7DDE2");
      const sv=c.querySelector("svg"); sv.setAttribute("width","640"); sv.setAttribute("height","200");
      if(d.beatrows.some(r=>filledStr(r[4]))) p.append(c);
    }
    let pair=[];
    const flushPair=()=>{if(pair.length){p.append(h("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:0 18px"},pair));pair=[]}};
    s.fields.forEach(f=>{
      if(f.id==="moodlink"&&!filledStr(d.moodlink)) return;
      const blk=h("div",{class:"pb-avoid"},h("h3",null,t(f.label)),pval(f,d[f.id]));
      if(f.half) pair.push(blk); else {flushPair();p.append(blk)}
    });
    flushPair();
  });
  p.append(h("div",{class:"pfoot"},h("span",null,(d.group||"")+(d.title?" · "+d.title:"")),h("span",null,t(U.course))));
  return p;
}
const translit=s=>s.replace(/[çÇğĞıİöÖşŞüÜ]/g,c=>({ç:"c",Ç:"C",ğ:"g",Ğ:"G",ı:"i",İ:"I",ö:"o",Ö:"O",ş:"s",Ş:"S",ü:"u",Ü:"U"}[c]));
const slug=s=>translit(s||"group").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"group";
const stamp=()=>new Date().toISOString().slice(0,10);
async function getDownloads(){
  if(!window.claude||typeof window.claude.use!=="function") return {inViewer:false,dl:null};
  try{return {inViewer:true,dl:await window.claude.use("downloads")}}catch(e){return {inViewer:true,dl:null}}
}
async function offerFile(filename,data){
  const {inViewer,dl}=await getDownloads();
  if(dl){
    try{await dl.save({filename,data});return "saved"}
    catch(e){ if(e&&e.code==="declined") return "declined"; if(e&&e.code==="rate_limited") return "busy"; throw e }
  }
  if(inViewer) return "none";
  const blob=data instanceof Blob?data:new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=h("a",{href:url,download:filename}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return "saved";
}
async function downloadPdf(){
  const btn=document.getElementById("dlbtn"); const el=document.getElementById("paper");
  if(!el||typeof html2pdf==="undefined"){toast(t(U.dlFail));return}
  btn.disabled=true; btn.textContent=t(U.making);
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const src=buildPaper(); src.removeAttribute("id"); src.id="paper"; src.style.margin="0";
    const y=window.scrollY; window.scrollTo(0,0);
    const blob=await html2pdf().set({
      margin:[10,10,12,10],
      image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",scrollX:0,scrollY:0},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],avoid:[".pb-avoid","tr","img","svg"]}
    }).from(src).outputPdf("blob");
    window.scrollTo(0,y);
    const res=await offerFile(slug(state.data.group)+"_Narrative-Brief_"+stamp()+".pdf",blob);
    toast(res==="saved"?t(U.pdfSaved):res==="declined"?t(U.cancelled):res==="none"?t(U.dlNone):t(U.dlFail));
  }catch(e){console.error(e);toast(t(U.dlFail))}
  finally{btn.disabled=false;btn.textContent=t(U.download)}
}
async function saveJson(){
  try{
    const res=await offerFile(slug(state.data.group)+"_Narrative-Brief_progress.json",JSON.stringify({form:"narrative-brief",...state}));
    if(res==="declined")toast(t(U.cancelled)); else if(res==="none")toast(t(U.dlNone)); else if(res==="saved")toast(t(U.saved));
  }catch(e){toast(t(U.dlFail))}
}
document.getElementById("jsonIn").addEventListener("change",e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    let d; try{d=JSON.parse(fr.result)}catch(err){toast(t(U.badJson));return}
    if(!d||d.form!=="narrative-brief"||!d.data){toast(t(U.badJson));return}
    const s=sanitize(d); const g=(s.data.group||"").trim()||(state?state.data.group:"");
    if(!g){toast(t(U.badJson));return}
    s.data.group=g; groupKey=keyFor(g); state=s; rememberGroup(g);
    document.getElementById("gate").hidden=true; document.getElementById("app").hidden=false;
    saveNow(); renderAll(); toast(t(U.loaded));
  };
  fr.readAsText(file);
});

    art,

    h("p",null,t(U.gateText)),
    h("label",{for:"groupIn",style:"font-weight:700"},t(U.groupLabel)),

    err,
    rec.length?h("div",null,h("div",{class:"mono",style:"color:var(--muted);margin-bottom:8px"},t(U.recent)),h("div",{class:"recent"},rec.map(x=>h("button",{class:"chipbtn",type:"button",onclick:()=>openGroup(x)},x)))):null,
    h("button",{class:"btn ghost",type:"button",style:"align-self:flex-start;padding-left:0",onclick:()=>document.getElementById("jsonIn").click()},t(U.openFile))
  ));
}
renderGate();
